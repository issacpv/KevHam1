<style>
*{box-sizing:border-box;margin:0;padding:0}
#app{width:100%;display:flex;flex-direction:column;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;font-family:var(--font-sans,system-ui)}
#top{display:grid;grid-template-columns:1fr 240px;height:480px}
#cvwrap{position:relative;background:#0c0f14;cursor:default}
canvas{display:block;width:100%;height:100%}
#right{border-left:0.5px solid var(--color-border-tertiary);padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;background:var(--color-background-primary)}
#bottom{border-top:0.5px solid var(--color-border-tertiary);padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:var(--color-background-primary)}
.sh{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-secondary);margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px}
.row label{font-size:11px;color:var(--color-text-secondary);min-width:58px;flex-shrink:0}
.vv{font-size:11px;font-weight:500;min-width:38px;text-align:right;color:var(--color-text-primary)}
input[type=range]{flex:1;min-width:0}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.pb{font-size:10px;padding:3px 9px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:transparent;color:var(--color-text-secondary);cursor:pointer}
.pb.on{background:var(--color-background-info);color:var(--color-text-info);border-color:transparent}
.nurow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nc{border-radius:8px;padding:8px 8px 6px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);text-align:center}
.nl{font-size:9px;color:var(--color-text-secondary);margin-bottom:3px}
.nv{font-size:16px;font-weight:500}
.aux{color:#1d9e75}.pos{color:#d85a30}.zer{color:var(--color-text-tertiary)}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px}
.badge.aux{background:#e1f5ee;color:#085041}
.badge.pos{background:#faece7;color:#4a1b0c}
.badge.zer{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.bottomrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat .sl{font-size:10px;color:var(--color-text-secondary)}
.stat .sv{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.hint{font-size:11px;color:var(--color-text-secondary);line-height:1.5}
</style>

<div id="app">
  <div id="top">
    <div id="cvwrap"><canvas id="c"></canvas></div>
    <div id="right">
      <div>
        <div class="sh">Triangle shape</div>
        <div class="presets" id="presets">
          <button class="pb on" data-p="equilateral">Equilateral</button>
          <button class="pb" data-p="isosceles">Isosceles</button>
          <button class="pb" data-p="scalene">Scalene</button>
          <button class="pb" data-p="right">Right</button>
          <button class="pb" data-p="flat">Flat</button>
        </div>
      </div>

      <div>
        <div class="sh">C — inner triangle ratio</div>
        <div class="row">
          <label>C</label>
          <input type="range" id="csl" min="0.05" max="0.93" step="0.01" value="0.40">
          <span class="vv" id="cv">0.40</span>
        </div>
        <div style="font-size:10px;color:var(--color-text-secondary);margin-top:4px;line-height:1.5">
          Low C = large hinges, more rotation.<br>High C = thin hinges, stiffer.
        </div>
      </div>

      <div>
        <div class="sh">Load direction θ</div>
        <div class="row">
          <label>θ</label>
          <input type="range" id="angsl" min="0" max="179" step="1" value="90">
          <span class="vv" id="angv">90°</span>
        </div>
      </div>

      <div>
        <div class="sh">ν per edge vector</div>
        <div class="nurow" id="nurow"></div>
      </div>

      <div>
        <div class="sh">Overall behavior</div>
        <div id="behavbox" style="margin-top:2px"></div>
        <div style="font-size:10px;color:var(--color-text-secondary);margin-top:6px;line-height:1.5" id="behavnote"></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div class="bottomrow">
      <div class="stat"><span class="sl">ε axial</span><span class="sv" id="s-ax">—</span></div>
      <div class="stat"><span class="sl">ε transverse</span><span class="sv" id="s-tr">—</span></div>
      <div class="stat"><span class="sl">Area ratio</span><span class="sv" id="s-ar">—</span></div>
      <div class="stat"><span class="sl">Edge ratio max/min</span><span class="sv" id="s-er">—</span></div>
      <div class="stat"><span class="sl">Delaunay</span><span class="sv" id="s-del">—</span></div>
      <div style="flex:1"></div>
      <div class="hint" id="draghint">Drag the <span style="color:#7f77dd">●</span> vertices to reshape the triangle</div>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---- geometry presets (fractions of canvas, set on init) ----
let W=0,H=0;
function preset(key){
  const cx=W/2,cy=H/2,r=Math.min(W,H)*0.31;
  const a=Math.PI/2;
  const pts={
    equilateral:[[cx,cy-r],[cx+r*Math.sin(2*Math.PI/3),cy-r*Math.cos(2*Math.PI/3)],[cx+r*Math.sin(4*Math.PI/3),cy-r*Math.cos(4*Math.PI/3)]],
    isosceles:[[cx,cy-r*1.1],[cx+r*0.55,cy+r*0.65],[cx-r*0.55,cy+r*0.65]],
    scalene:[[cx-r*0.1,cy-r],[cx+r*0.95,cy+r*0.55],[cx-r*0.8,cy+r*0.65]],
    right:[[cx-r*0.85,cy-r*0.75],[cx+r*0.85,cy+r*0.65],[cx-r*0.85,cy+r*0.65]],
    flat:[[cx-r,cy+r*0.1],[cx+r,cy+r*0.25],[cx,cy-r*0.28]],
  };
  return pts[key]||pts.equilateral;
}

// ---- state ----
const ST={pts:null,C:0.40,angle:90,drag:null,shape:'equilateral'};

// ---- math ----
const v2a=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const v2s=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const v2sc=(a,s)=>[a[0]*s,a[1]*s];
const v2d=(a,b)=>a[0]*b[0]+a[1]*b[1];
const v2l=a=>Math.sqrt(v2d(a,a));
const v2n=a=>{const l=v2l(a);return l<1e-12?[0,0]:v2sc(a,1/l);};
const v2p=a=>[-a[1],a[0]];
const vmid=ps=>{const r=[0,0];ps.forEach(p=>{r[0]+=p[0];r[1]+=p[1]});return[r[0]/ps.length,r[1]/ps.length]};
const vlrp=(a,b,t)=>v2a(v2sc(a,1-t),v2sc(b,t));
const v2cross=(a,b)=>a[0]*b[1]-a[1]*b[0];

function triArea(P){
  return Math.abs(v2cross(v2s(P[1],P[0]),v2s(P[2],P[0])))/2;
}

// ---- core: inner triangle via centroid ----
function getInner(P,C){
  const S=vmid(P);
  const T=P.map(p=>v2a(v2sc(S,C),v2sc(p,1-C)));
  return {S,T};
}

// ---- kinematic derivation: NO assumed nu ----
// Derives displacement of each outer vertex from hinge compliance + torque balance
// Then measures how each edge vector changes → that IS the nu
function kinematic(P,C,angleDeg){
  const{S,T}=getInner(P,C);
  const cP=vmid(P);
  const ang=angleDeg*Math.PI/180;
  const u=[Math.cos(ang),Math.sin(ang)];

  // Hinge compliance: ki = (1-C)^2 * |Pi - S|^2
  // Larger C → stiffer (thinner hinge), smaller C → more compliant
  const ki=P.map(p=>{const d=v2l(v2s(p,S));return Math.max((1-C)*(1-C)*d*d,1e-8);});
  const kSum=ki.reduce((a,b)=>a+b,0);
  const wi=ki.map(k=>k/kSum); // normalized weights

  // Applied displacement of each Pi under unit strain along u
  // (affine strain field: δPi = dot(Pi - centroid, u) * u)
  const dP=P.map(p=>v2sc(u,v2d(v2s(p,cP),u)));

  // Weighted displacement of inner centroid S
  const dS=[wi[0]*dP[0][0]+wi[1]*dP[1][0]+wi[2]*dP[2][0],
             wi[0]*dP[0][1]+wi[1]*dP[1][1]+wi[2]*dP[2][1]];

  // 2D angular velocity from torque balance on inner triangle
  // τ = Σ wi * (Ti-S) × (dPi - dS)
  let tau=0,Izz=0;
  for(let i=0;i<3;i++){
    const r=v2s(T[i],S);
    const df=v2s(dP[i],dS);
    tau+=wi[i]*v2cross(r,df);
    Izz+=wi[i]*(r[0]*r[0]+r[1]*r[1]);
  }
  const omega=Izz>1e-10?tau/Izz:0;

  // Displacement of each Ti
  const dT=T.map(ti=>{
    const r=v2s(ti,S);
    return v2a(dS,[-omega*r[1],omega*r[0]]);
  });

  // Effective outer vertex displacement = hinge stretch along hinge direction
  const Peff=P.map((p,i)=>{
    const hinge=v2s(p,T[i]);
    const dhinge=v2s(dP[i],dT[i]);
    const hdir=v2n(hinge);
    const stretch=v2d(dhinge,hdir);
    // new pos: T_new + hinge_new
    return v2a(v2a(T[i],dT[i]),v2a(hinge,v2sc(hdir,stretch)));
  });

  // Edge strains
  const edges=[[0,1],[1,2],[0,2]];
  const edgeData=edges.map(([a,b])=>{
    const ev=v2s(P[b],P[a]);
    const evn=v2n(ev);
    const l0=v2l(ev);
    const evD=v2s(Peff[b],Peff[a]);
    const l1=v2l(evD);
    const eEdge=(l1-l0)/l0;
    // Component of edge vector along and perpendicular to load
    const along=Math.abs(v2d(evn,u));
    const trans=Math.sqrt(Math.max(0,1-along*along));
    // ν = -ε_edge / ε_applied (only meaningful when edge is not parallel to load)
    const nu=trans>0.15?-eEdge/1.0:null;
    return{a,b,l0,l1,eEdge,nu,along,trans};
  });

  // Bounding box strains
  const exts=P.map(p=>v2d(p,u));
  const extsD=Peff.map(p=>v2d(p,u));
  const pu=v2p(u);
  const extsP=P.map(p=>v2d(p,pu));
  const extsPD=Peff.map(p=>v2d(p,pu));
  const eAx=((Math.max(...extsD)-Math.min(...extsD))-(Math.max(...exts)-Math.min(...exts)))/(Math.max(...exts)-Math.min(...exts)+1e-10);
  const eTr=((Math.max(...extsPD)-Math.min(...extsPD))-(Math.max(...extsP)-Math.min(...extsP)))/(Math.max(...extsP)-Math.min(...extsP)+1e-10);
  const nuBBox=Math.abs(eAx)>1e-6?-eTr/eAx:0;

  // Area
  const A0=triArea(P),A1=triArea(Peff);

  return{S,T,dP,dT,Peff,edgeData,eAx,eTr,nuBBox,A0,A1,u,wi,omega};
}

// ---- Bezier smoothing curves (from algorithm) ----
function bezierCurves(P,T,S,C){
  const curves=[];
  for(let i=0;i<3;i++){
    const ti=T[i];
    const j=(i+1)%3,k=(i+2)%3;
    // g points: where spokes from inner vertex toward outer face edges hit something
    const gpts=[vlrp(ti,T[j],0.45),vlrp(ti,T[k],0.45)];
    // h points: midpoints toward outer edges
    const hpts=[vlrp(P[i],P[j],0.42),vlrp(P[i],P[k],0.42)];
    for(const q of[...gpts,...hpts]){
      // j_pt: line from S to q, intersect inner triangle edge (approximate as lerp)
      const jpt=vlrp(ti,q,0.28);
      const N=10;
      const pts=[];
      for(let n=0;n<=N;n++){
        const z=n/N;
        pts.push(v2a(v2a(v2sc(jpt,(1-z)*(1-z)),v2sc(ti,2*(1-z)*z)),v2sc(q,z*z)));
      }
      curves.push({pts,ci:i});
    }
  }
  return curves;
}

// Delaunay check: circumcircle criterion
function checkDelaunay(P){
  const el=[[0,1],[1,2],[0,2]].map(([a,b])=>v2l(v2s(P[b],P[a])));
  const ratio=Math.max(...el)/Math.min(...el);
  const area=triArea(P);
  if(area<200)return'degenerate';
  if(ratio>5)return'poor';
  return'ok';
}

// ---- Draw ----
const VCOLS=['#8b82e8','#2ab88a','#e07550'];
const ECOLS=['#ef9f27','#5daaee','#e066a0'];

function hexToRgb(h){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return`${r},${g},${b}`;
}

function draw(){
  const cw=cv.offsetWidth,ch=cv.offsetHeight;
  cv.width=cw*devicePixelRatio;cv.height=ch*devicePixelRatio;
  ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,cw,ch);

  if(!ST.pts)return;
  const P=ST.pts;
  const res=kinematic(P,ST.C,ST.angle);
  const{S,T,Peff,edgeData,eAx,eTr,nuBBox,A0,A1,u,omega}=res;

  // ---- Visualization scale for deformation (exaggerated) ----
  const visS=35;
  const Pvis=P.map((p,i)=>v2a(p,v2sc(v2s(Peff[i],p),visS)));
  const Tvis=T.map((t,i)=>v2a(t,v2sc(res.dT[i],visS)));

  // ---- Draw outer triangle (original, ghost) ----
  ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);P.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
  ctx.fillStyle='rgba(127,119,221,0.06)';ctx.fill();
  ctx.strokeStyle='rgba(127,119,221,0.30)';ctx.lineWidth=1.2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);

  // ---- Draw deformed outer triangle ----
  ctx.beginPath();ctx.moveTo(Pvis[0][0],Pvis[0][1]);Pvis.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
  ctx.fillStyle='rgba(93,202,165,0.07)';ctx.fill();
  ctx.strokeStyle='rgba(93,202,165,0.65)';ctx.lineWidth=2;ctx.stroke();

  // ---- Polyhedron H regions (one per vertex) ----
  for(let i=0;i<3;i++){
    const j=(i+1)%3,k=(i+2)%3;
    const col=hexToRgb(VCOLS[i]);
    // Region bounded by: Pi, midpoint of edge ij, inner T centroid area, midpoint of edge ik
    const mij=vlrp(P[i],P[j],0.42);
    const mik=vlrp(P[i],P[k],0.42);
    const tij=vlrp(T[i],T[j],0.42);
    const tik=vlrp(T[i],T[k],0.42);
    ctx.beginPath();
    ctx.moveTo(P[i][0],P[i][1]);
    ctx.lineTo(mij[0],mij[1]);
    ctx.lineTo(T[i][0],T[i][1]);
    ctx.lineTo(tij[0],tij[1]);
    ctx.lineTo(T[i][0],T[i][1]);
    ctx.lineTo(tik[0],tik[1]);
    ctx.lineTo(T[i][0],T[i][1]);
    ctx.lineTo(mik[0],mik[1]);
    ctx.closePath();
    ctx.fillStyle=`rgba(${col},0.10)`;ctx.fill();
    ctx.strokeStyle=`rgba(${col},0.35)`;ctx.lineWidth=0.8;ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([]);
  }

  // ---- Bezier smoothing curves ----
  const bzCurves=bezierCurves(P,T,S,ST.C);
  bzCurves.forEach(({pts,ci})=>{
    const col=hexToRgb(VCOLS[ci]);
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
    ctx.strokeStyle=`rgba(${col},0.45)`;ctx.lineWidth=1.0;ctx.stroke();
  });

  // ---- Inner triangle (original) ----
  ctx.beginPath();ctx.moveTo(T[0][0],T[0][1]);T.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
  ctx.fillStyle='rgba(239,159,39,0.10)';ctx.fill();
  ctx.strokeStyle='rgba(239,159,39,0.75)';ctx.lineWidth=1.5;ctx.stroke();

  // ---- Deformed inner triangle ----
  ctx.beginPath();ctx.moveTo(Tvis[0][0],Tvis[0][1]);Tvis.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
  ctx.strokeStyle='rgba(239,159,39,0.35)';ctx.lineWidth=1;ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([]);

  // ---- Hinge lines Pi → Ti ----
  for(let i=0;i<3;i++){
    const col=hexToRgb(VCOLS[i]);
    ctx.strokeStyle=`rgba(${col},0.28)`;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(T[i][0],T[i][1]);ctx.stroke();
  }

  // ---- Load axis arrow ----
  const cP=vmid(P);
  const axLen=Math.min(W,H)*0.14;
  const ax0=v2s(cP,v2sc(u,axLen));
  const ax1=v2a(cP,v2sc(u,axLen));
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ax0[0],ax0[1]);ctx.lineTo(ax1[0],ax1[1]);ctx.stroke();
  const ad=v2n(u);
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath();ctx.moveTo(ax1[0],ax1[1]);
  ctx.lineTo(ax1[0]-9*ad[0]+4*ad[1],ax1[1]-9*ad[1]-4*ad[0]);
  ctx.lineTo(ax1[0]-9*ad[0]-4*ad[1],ax1[1]-9*ad[1]+4*ad[0]);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='bold 11px system-ui';ctx.textAlign='center';
  ctx.fillText('ε',ax1[0]+8*ad[0],ax1[1]+8*ad[1]+4);
  ctx.textAlign='left';

  // ---- Displacement arrows on vertices ----
  for(let i=0;i<3;i++){
    const d=v2s(Pvis[i],P[i]);
    const dl=v2l(d);
    if(dl<2)continue;
    const col=hexToRgb(VCOLS[i]);
    ctx.strokeStyle=`rgba(${col},0.85)`;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(Pvis[i][0],Pvis[i][1]);ctx.stroke();
    const dn=v2n(d);
    ctx.fillStyle=`rgba(${col},0.85)`;
    ctx.beginPath();ctx.moveTo(Pvis[i][0],Pvis[i][1]);
    ctx.lineTo(Pvis[i][0]-8*dn[0]+3.5*dn[1],Pvis[i][1]-8*dn[1]-3.5*dn[0]);
    ctx.lineTo(Pvis[i][0]-8*dn[0]-3.5*dn[1],Pvis[i][1]-8*dn[1]+3.5*dn[0]);
    ctx.closePath();ctx.fill();
  }

  // ---- Edge ν labels on canvas ----
  const eLbls=['E₀₁','E₁₂','E₀₂'];
  [[0,1],[1,2],[0,2]].forEach(([a,b],k)=>{
    const m=vmid([P[a],P[b]]);
    const ev=v2n(v2s(P[b],P[a]));
    const off=v2sc(v2p(ev),18);
    const{nu}=edgeData[k];
    if(nu===null)return;
    const col=nu<-0.05?'#2ab88a':nu>0.05?'#e07550':'#888';
    ctx.fillStyle=col;ctx.font='bold 11px system-ui';ctx.textAlign='center';
    ctx.fillText(`ν=${nu.toFixed(2)}`,m[0]+off[0],m[1]+off[1]);
    ctx.textAlign='left';
    // Edge line colored by nu
    ctx.strokeStyle=`${col}88`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(P[a][0],P[a][1]);ctx.lineTo(P[b][0],P[b][1]);ctx.stroke();
  });

  // ---- Inner T vertex labels ----
  T.forEach((t,i)=>{
    ctx.beginPath();ctx.arc(t[0],t[1],3.5,0,2*Math.PI);
    ctx.fillStyle='#ef9f27';ctx.fill();
  });

  // ---- Centroid ----
  ctx.beginPath();ctx.arc(S[0],S[1],4.5,0,2*Math.PI);
  ctx.fillStyle='#5dcaa5';ctx.fill();
  ctx.fillStyle='rgba(93,202,165,0.8)';ctx.font='10px system-ui';ctx.fillText('S',S[0]+6,S[1]-4);

  // ---- Outer vertices (draggable) ----
  const vLbls=['P₀','P₁','P₂'];
  P.forEach((p,i)=>{
    ctx.beginPath();ctx.arc(p[0],p[1],8,0,2*Math.PI);
    const col=hexToRgb(VCOLS[i]);
    ctx.fillStyle=`rgba(${col},0.9)`;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='white';ctx.font='500 11px system-ui';
    ctx.fillText(vLbls[i],p[0]+11,p[1]+4);
    // Deformed position dot
    ctx.beginPath();ctx.arc(Pvis[i][0],Pvis[i][1],4,0,2*Math.PI);
    ctx.fillStyle=`rgba(${col},0.55)`;ctx.fill();
  });

  // ---- Update sidebar ----
  const nuDisp=edgeData.map(({nu,a,b},k)=>{
    const v=nu===null?null:nu;
    const cls=v===null?'zer':v<-0.05?'aux':v>0.05?'pos':'zer';
    const txt=v===null?'—':v.toFixed(3);
    return`<div class="nc"><div class="nl">${eLbls[k]}</div><div class="nv ${cls}">${txt}</div></div>`;
  });
  document.getElementById('nurow').innerHTML=nuDisp.join('');

  const allNu=edgeData.map(e=>e.nu).filter(v=>v!==null);
  const auxCount=allNu.filter(v=>v<-0.05).length;
  const posCount=allNu.filter(v=>v>0.05).length;
  const beh=auxCount>posCount?'aux':posCount>auxCount?'pos':'zer';
  const behTxt=beh==='aux'?'Auxetic':beh==='pos'?'Conventional':'Near-zero';
  document.getElementById('behavbox').innerHTML=`<span class="badge ${beh}">${behTxt}</span>`;
  const note=beh==='aux'
    ?`Gets wider when stretched — ${auxCount}/3 edges expand laterally. Driven by inner triangle rotation (ω=${omega.toFixed(3)} rad/unit).`
    :beh==='pos'
    ?`Behaves conventionally — narrows when stretched. Try a smaller C or a more isosceles shape.`
    :`Near-zero lateral response. At a transition point between auxetic and conventional.`;
  document.getElementById('behavnote').textContent=note;

  // ---- Bottom stats ----
  document.getElementById('s-ax').textContent=eAx.toFixed(4);
  document.getElementById('s-tr').textContent=eTr.toFixed(4);
  document.getElementById('s-ar').textContent=(A1/A0).toFixed(4);
  const el2=[[0,1],[1,2],[0,2]].map(([a,b])=>v2l(v2s(P[b],P[a])));
  document.getElementById('s-er').textContent=(Math.max(...el2)/Math.min(...el2)).toFixed(2)+'×';
  const del=checkDelaunay(P);
  const delEl=document.getElementById('s-del');
  delEl.textContent=del==='ok'?'✓ Good':del==='poor'?'⚠ Poor':'⚠ Degen';
  delEl.style.color=del==='ok'?'var(--color-text-success)':'var(--color-text-danger)';
}

// ---- Interaction ----
function nearVert(x,y,r=16){
  let bi=-1,bd=Infinity;
  ST.pts.forEach((p,i)=>{const d=v2l(v2s([x,y],p));if(d<bd&&d<r){bd=d;bi=i;}});
  return bi;
}
function evXY(e){
  const r=cv.getBoundingClientRect();
  const dpr=cv.width/devicePixelRatio/r.width;
  return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr];
}
cv.addEventListener('mousedown',e=>{const[x,y]=evXY(e);ST.drag=nearVert(x,y);if(ST.drag>=0)cv.style.cursor='grabbing';});
cv.addEventListener('mousemove',e=>{
  const[x,y]=evXY(e);
  if(ST.drag!==null&&ST.drag>=0){ST.pts[ST.drag]=[x,y];draw();}
  else cv.style.cursor=nearVert(x,y)>=0?'grab':'default';
});
cv.addEventListener('mouseup',()=>{ST.drag=null;cv.style.cursor='default';});
cv.addEventListener('mouseleave',()=>{ST.drag=null;});
cv.addEventListener('touchstart',e=>{e.preventDefault();const[x,y]=evXY(e.touches[0]);ST.drag=nearVert(x,y,22);},{passive:false});
cv.addEventListener('touchmove',e=>{if(ST.drag<0)return;e.preventDefault();const[x,y]=evXY(e.touches[0]);ST.pts[ST.drag]=[x,y];draw();},{passive:false});
cv.addEventListener('touchend',()=>{ST.drag=null;});

// ---- Controls ----
function sl(id,oid,fmt,cb){
  const el=document.getElementById(id),vo=document.getElementById(oid);
  el.addEventListener('input',()=>{const v=parseFloat(el.value);vo.textContent=fmt(v);cb(v);draw();});
}
sl('csl','cv',v=>v.toFixed(2),v=>{ST.C=v});
sl('angsl','angv',v=>Math.round(v)+'°',v=>{ST.angle=v});

document.querySelectorAll('#presets .pb').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#presets .pb').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');ST.shape=b.dataset.p;
    ST.pts=preset(b.dataset.p);draw();
  });
});

// ---- Init ----
function init(){
  const wrap=document.getElementById('cvwrap');
  W=wrap.offsetWidth;H=wrap.offsetHeight;
  if(W<10||H<10)return;
  if(!ST.pts)ST.pts=preset('equilateral');
  else{
    const cx=W/2,cy=H/2,r=Math.min(W,H)*0.31;
    ST.pts=preset(ST.shape);
  }
  draw();
}
new ResizeObserver(init).observe(document.getElementById('cvwrap'));
setTimeout(init,30);
</script>
